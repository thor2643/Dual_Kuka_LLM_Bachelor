# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      
    threef_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      
    twof_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

right_arm_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: false
    joints:
      - right_A1
      - right_A2
      - right_A3
      - right_A4
      - right_A5
      - right_A6
      - right_A7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
left_arm_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: false
    joints:
      - left_A1
      - left_A2
      - left_A3
      - left_A4
      - left_A5
      - left_A6
      - left_A7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
threef_gripper_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: false
    joints:
      - 3f_finger_1_joint_1
      - 3f_finger_1_joint_2
      - 3f_finger_1_joint_3
      - 3f_finger_2_joint_1
      - 3f_finger_2_joint_2
      - 3f_finger_2_joint_3
      - 3f_finger_middle_joint_1
      - 3f_finger_middle_joint_2
      - 3f_finger_middle_joint_3
      - 3f_palm_finger_1_joint
      - 3f_palm_finger_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
twof_gripper_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: false
    joints:
      - left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
